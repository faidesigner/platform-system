<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
        font-size: 12px;
      }

      .shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        padding: 16px;
        border-bottom: 1px solid var(--figma-color-border);
      }

      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      .hint {
        margin-top: 6px;
        color: var(--figma-color-text-secondary);
        line-height: 1.45;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--figma-color-border);
      }

      button {
        height: 32px;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
        font: inherit;
        padding: 0 10px;
      }

      button.primary {
        margin-left: auto;
        border-color: var(--figma-color-bg-brand);
        background: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
      }

      main {
        flex: 1;
        overflow: auto;
        padding: 8px;
      }

      label.row {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 8px;
        align-items: center;
        padding: 10px 8px;
        border-radius: 6px;
      }

      label.row:hover {
        background: var(--figma-color-bg-hover);
      }

      input {
        margin-top: 1px;
      }

      .name {
        font-weight: 600;
      }

      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--figma-color-border);
      }

      .selected {
        color: var(--figma-color-text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>figma-component-input</h1>
        <div class="hint">생성할 컴포넌트만 선택하면 Generated 페이지에 추가됩니다. Published는 건드리지 않습니다.</div>
      </header>
      <div class="toolbar">
        <button id="select-all" type="button">전체 선택</button>
        <button id="clear" type="button">해제</button>
      </div>
      <main id="list"></main>
      <footer>
        <span class="selected" id="selected-count">0개 선택</span>
        <button id="cancel" type="button">취소</button>
        <button id="generate" class="primary" type="button">생성</button>
      </footer>
    </div>

    <script>
      const list = document.getElementById("list");
      const selectedCount = document.getElementById("selected-count");
      const selectAllButton = document.getElementById("select-all");
      const clearButton = document.getElementById("clear");
      const cancelButton = document.getElementById("cancel");
      const generateButton = document.getElementById("generate");

      function checkedInputs() {
        return Array.from(document.querySelectorAll("input[type='checkbox']:checked"));
      }

      function updateCount() {
        selectedCount.textContent = checkedInputs().length + "개 선택";
      }

      function render(components) {
        list.innerHTML = components.map((component) => `
          <label class="row">
            <input type="checkbox" value="${component.id}" />
            <span class="name">${component.name}</span>
          </label>
        `).join("");
        list.querySelectorAll("input").forEach((input) => input.addEventListener("change", updateCount));
        updateCount();
      }

      selectAllButton.onclick = () => {
        document.querySelectorAll("input[type='checkbox']").forEach((input) => {
          input.checked = true;
        });
        updateCount();
      };

      clearButton.onclick = () => {
        document.querySelectorAll("input[type='checkbox']").forEach((input) => {
          input.checked = false;
        });
        updateCount();
      };

      cancelButton.onclick = () => {
        parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
      };

      generateButton.onclick = () => {
        parent.postMessage({
          pluginMessage: {
            type: "generate",
            ids: checkedInputs().map((input) => input.value),
          },
        }, "*");
      };

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (message.type === "init") {
          render(message.components);
        }
      };
    </script>
  </body>
</html>
